[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "papermatrix"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "pymupdf",
    "pydantic",
    "pandas",
    "openai",
    "certifi"
]

[project.optional-dependencies]
test = [
    "pytest",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "httpx>=0.27,<1",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
papermatrix = "papermatrix.cli:app"
papermatrix-web = "papermatrix.web:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--basetemp=.pytest_tmp"]
markers = [
    "integration: opt-in tests that call real external services",
]

[tool.setuptools.packages.find]
include = ["papermatrix*"]

[tool.setuptools.package-data]
papermatrix = ["presets/*.json", "web_assets/*"]
